<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D swiper slider</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<style>
 :root {
    --swiper-navigation-size: 30px;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: white;
    margin: 0;
    padding: 0;
  }
  
  .swiper {
    width: 95%;
    max-width: 1350px;
    padding-bottom: 70px;  
}

   .swiper-slide {
    background: #ccc;
    border: 1px solid #0000008f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 380px;
    font-size: 50px;
    width: 400px;
   }
   
   @media (max-width: 600px) {
     .swiper-slide {
       height: 280px;
       width: 300px;
     }
   }
   
   .swiper-slide img{
    width: 100%;
    height: 100%;
    object-fit: cover;
   }

   .swiper-button-next,
   .swiper-button-prev {
    color: #fff;
    background: rgba(0, 0, 0, 0.5);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    transition: all 0.3s ease;
   }

   .swiper-button-next:hover,
   .swiper-button-prev:hover {
    background: rgba(0, 0, 0, 0.8);
    transform: scale(1.1);
   }

   .swiper-button-next::after,
   .swiper-button-prev::after {
    font-size: 20px;
    font-weight: bold;
   }
  
  .swiper-slide {
    background-color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    color: #000;
  }
</style>
<body>
   
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="https://picsum.photos/600/400?random=1" alt="Slide 1">
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/600/400?random=2" alt="Slide 2">
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/600/400?random=3" alt="Slide 3">
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/600/400?random=4" alt="Slide 4">
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/600/400?random=5" alt="Slide 5">
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/600/400?random=6" alt="Slide 6">
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/600/400?random=7" alt="Slide 7">
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/600/400?random=8" alt="Slide 8">
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/600/400?random=9" alt="Slide 9">
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/600/400?random=10" alt="Slide 10">
        </div>
        </div>
        <!-- arrow -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>    
</body>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    var swiper = new Swiper(".mySwiper", {
      effect: "coverflow",
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: "auto",
      coverflowEffect: {
        rotate: 30,
        stretch: 0,
        depth: 200,
        modifier: 1,
        slideShadows: false,
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
      loop: true,
    });
</script>
</html>
